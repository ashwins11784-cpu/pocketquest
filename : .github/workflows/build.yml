name: Build PocketQuest

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pygbag
        run: pip install pygbag

      - name: Build game
        run: python -m pygbag --build .

      - name: Upload web game
        uses: actions/upload-artifact@v4
        with:
          name: PocketQuest-Web
          path: build/web/
